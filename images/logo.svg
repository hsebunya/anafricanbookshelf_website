<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="An African Bookshelf Logo">
  <title>An African Bookshelf Logo</title>
  <rect width="120" height="120" rx="24" fill="#FAF7F2" stroke="#E4DACB" stroke-width="2"/>
  
  <!-- Stylized African Bookshelf Composition with Brand Accent Colours -->
  <!-- Book 1: Ochre Yellow -->
  <rect x="22" y="38" width="14" height="52" rx="3" fill="#D9822B" transform="rotate(-6 22 38)"/>
  
  <!-- Book 2: Brick Red -->
  <rect x="40" y="32" width="15" height="58" rx="3" fill="#B83E26"/>
  <rect x="43" y="38" width="9" height="3" rx="1.5" fill="#FAF7F2" opacity="0.8"/>
  <rect x="43" y="44" width="9" height="3" rx="1.5" fill="#FAF7F2" opacity="0.8"/>
  
  <!-- Book 3: Green -->
  <rect x="59" y="42" width="14" height="48" rx="3" fill="#2B6B48"/>
  
  <!-- Book 4: Teal (leaning slightly) -->
  <rect x="77" y="34" width="14" height="56" rx="3" fill="#197B74" transform="rotate(7 77 34)"/>
  
  <!-- Shelf Base: Blue -->
  <rect x="18" y="90" width="84" height="7" rx="3.5" fill="#1C4C74"/>
</svg>

